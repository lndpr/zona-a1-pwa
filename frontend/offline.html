<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>Offline | ZONA A1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #050914; color: #e8f2fa; font: 15px/1.6 Inter, Arial, sans-serif; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #203448; border-radius: 20px; background: #0b1421; text-align: center; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { color: #a9bacb; }
    button { margin-top: 14px; padding: 12px 18px; border: 0; border-radius: 999px; background: #19b6c9; color: #03131a; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>ZONA A1 sedang offline</h1>
    <p>Koneksi internet sedang tidak tersedia. Periksa jaringan Anda, lalu coba buka kembali dashboard.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
